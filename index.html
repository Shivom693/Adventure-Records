  <body class="font-inter antialiased min-h-screen overflow-x-hidden" style="background-color: var(--bg-primary); color: var(--text-primary);">
    <!-- Blocking theme initialization to prevent FOUC -->
    <script>
      (function() {
        var theme = localStorage.getItem('adventure-theme');
        var root = document.documentElement;
        if (theme === 'light') {
          root.classList.remove('dark');
          root.classList.add('light');
        } else {
          root.classList.add('dark');
          root.classList.remove('light');
        }
      })();
    </script>
